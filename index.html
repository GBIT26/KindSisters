<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kind Sisters Website — Course Submission</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=La+Belle+Aurore&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Open Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #F8E8F1 0%, #FFFFFF 50%, #FFF5E6 100%);
    }
    .landing {
      text-align: center;
      max-width: 600px;
      padding: 3rem 2rem;
    }
    .landing img {
      max-width: 250px;
      margin-bottom: 1.5rem;
    }
    .landing h1 {
      font-family: 'La Belle Aurore', cursive;
      color: #D42278;
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }
    .landing p {
      color: #666;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }
    .landing .info {
      font-size: 0.85rem;
      color: #999;
      margin-top: 0.5rem;
    }
    .btn-version {
      display: block;
      width: 100%;
      padding: 1rem 2rem;
      margin-bottom: 1rem;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1.1rem;
      text-decoration: none;
      transition: all 0.3s ease;
    }
    .btn-version:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    }
    .btn-a {
      background: #D42278;
      color: #fff;
    }
    .btn-a:hover { background: #B01A5B; color: #fff; }
    .btn-b {
      background: #EF8E04;
      color: #fff;
    }
    .btn-b:hover { background: #CC7A00; color: #fff; }
    .meta {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="landing">
    <img src="version-a/assets/logo/kind-sisters-logo.png" alt="Kind Sisters Logo">
    <h1>Kind Sisters</h1>
    <p>Website Redesign — ICT50220 Workplace Integration Program</p>

    <a href="version-a/index.html" class="btn-version btn-a">
      Kind Sisters Website
      <span class="info d-block">View the Kind Sisters website</span>
    </a>

    <div class="meta">
      <p>Student: Gavin Brown &bull; Client: Kind Sisters Ltd (ACNC Charity)<br>
      College: Equinum College &bull; RTO: 45758</p>
    </div>
  </div>
</body>
</html>
